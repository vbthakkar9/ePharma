spring:
  application:
    name: pharmacy-saas

  datasource:
    url: jdbc:postgresql://localhost:5432/pharmacy_saas_dev
    username: pharmacy_user
    password: pharmacy_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          lob:
            non_contextual_creation: true
        generate_statistics: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

  session:
    jdbc:
      initialize-schema: always
      table-name: spring_session
    timeout: 1800
    store-type: jdbc

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        secure: false
        same-site: strict
        max-age: 28800
      tracking-modes: cookie

security:
  rate-limit:
    login:
      max-attempts: 5
      window-minutes: 15
    password-reset:
      max-attempts: 3
      window-minutes: 60
  session:
    max-concurrent-sessions: 5
    max-session-age-hours: 8
    idle-timeout-minutes: 30
  password-reset:
    token-expiry-minutes: 15
  csrf:
    enabled: true

app:
  tenant:
    header-name: X-Tenant-ID
  audit:
    async-enabled: true
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173"
    allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

logging:
  level:
    com.pharmacy.saas: DEBUG
    org.springframework.security: DEBUG
    org.springframework.session: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/pharmacy-saas.log
    max-size: 100MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.pharmacy.saas
  default-produces-media-type: application/json
  default-consumes-media-type: application/json