spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pharmacy_saas_dev
    username: pharmacy_user
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    validate-on-migrate: false

  session:
    jdbc:
      initialize-schema: always

logging:
  level:
    com.pharmacy.saas: DEBUG
    org.springframework.security: DEBUG
    org.springframework.session: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE