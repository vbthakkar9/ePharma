spring:
  application:
    name: pharmacy-saas-test

  datasource:
    url: jdbc:tc:postgresql:16:///pharmacy_saas_test
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  session:
    jdbc:
      initialize-schema: always

  testcontainers:
    postgresql:
      image: postgres:16-alpine

server:
  port: 0

security:
  password-encoder:
    bcrypt-cost: 4

logging:
  level:
    com.pharmacy.saas: DEBUG
    org.springframework.security: DEBUG
    org.springframework.session: DEBUG
    org.hibernate.SQL: DEBUG
    org.testcontainers: INFO